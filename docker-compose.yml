version: '3.8'

services:
  #1. baza de date PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: telemetry_postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  #2. Message Broker (RabbitMQ cu interfata de Management)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: telemetry_rabbitmq
    ports:
      - "5672:5672"    # Portul pentru trimis/primit mesaje din cod
      - "15672:15672"  # Portul pentru interfața web de administrare
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data: